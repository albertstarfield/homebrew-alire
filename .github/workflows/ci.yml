name: Cask CI

on:
  push:
  pull_request:

jobs:
  audit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tap local checkout
        run: brew tap albertstarfield/alire "$GITHUB_WORKSPACE"
      - name: Trust local tap
        run: brew trust albertstarfield/alire
      - name: Update Homebrew
        run: brew update
      - name: Audit formula
        run: brew audit --strict --online albertstarfield/alire/alr
      - name: Check style
        run: brew style albertstarfield/alire/alr
