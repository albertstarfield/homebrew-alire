name: Installation UX Test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: formula
            target: albertstarfield/alire/alr
          - os: ubuntu-latest
            kind: formula
            target: albertstarfield/alire/alr
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Put Homebrew on PATH
        run: |
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then
            echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          fi
          if [ -x /opt/homebrew/bin/brew ]; then
            echo "/opt/homebrew/bin" >> "$GITHUB_PATH"
          fi
      - name: Tap local checkout
        run: |
          brew untap albertstarfield/alire || true
          brew tap albertstarfield/alire "$GITHUB_WORKSPACE"
      - name: Trust local tap
        run: brew trust albertstarfield/alire
      - name: Update Homebrew
        run: brew update
      - name: Audit formula
        env:
          TARGET: ${{ matrix.target }}
        run: brew audit --strict --online --formula "$TARGET"
      - name: Check style
        env:
          TARGET: ${{ matrix.target }}
        run: brew style "$TARGET"
      - name: Install and report result
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_OS_NAME: ${{ matrix.os }}
        run: |
          set +e
          brew install "$TARGET"
          code=$?
          printf '### %s\ninstall_exit=%s\n' "$RUNNER_OS_NAME" "$code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
