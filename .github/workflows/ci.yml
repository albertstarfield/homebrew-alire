name: Cask CI

on:
  push:
  pull_request:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            kind: formula
            target: albertstarfield/alire/alr
          - os: ubuntu-latest
            kind: formula
            target: albertstarfield/alire/alr
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c
      - name: Tap local checkout
        run: brew tap albertstarfield/alire "$GITHUB_WORKSPACE"
      - name: Trust local tap
        run: brew trust albertstarfield/alire
      - name: Update Homebrew
        run: brew update
      - name: Audit formula
        env:
          TARGET: ${{ matrix.target }}
        run: brew audit --strict --online "$TARGET"
      - name: Check style
        env:
          TARGET: ${{ matrix.target }}
        run: brew style "$TARGET"
      - name: Install and report result
        env:
          TARGET: ${{ matrix.target }}
          RUNNER_OS_NAME: ${{ matrix.os }}
        run: |
          set +e
          brew install "$TARGET"
          code=$?
          printf '### %s\ninstall_exit=%s\n' "$RUNNER_OS_NAME" "$code" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
